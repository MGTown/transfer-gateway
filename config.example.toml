[server]
bind = "0.0.0.0:25565"
max_connections = 4096
login_timeout_ms = 10000
max_frame_length = 2097152

supported_protocols = []
status_version_name = "1.20.5 - 26.3 Snapshot 10"
status_protocol = 1073742156
max_players = 100

motd = "&6Transfer &aGateway\n&7IP routing gateway"
strict_error_handling = false

[language]
locale = "zh-CN"
directory = "./lang"

[logging]
file = "./logs/gateway.log"

[ip2region]
v4_db = "./data/ip2region_v4.xdb"
v6_db = "./data/ip2region_v6.xdb"
auto_download = true
download_base_url = "https://raw.githubusercontent.com/lionsoul2014/ip2region/v3.17.0/data"

[routing]
default_line = "global"

[routing.lines.global]
host = "global.example.com"
port = 25565

[routing.lines.cn]
host = "cn.example.com"
port = 25565

[routing.lines.cn-telecom]
host = "telecom.example.com"
port = 25565

[[routing.rules]]
priority = 50
line = "cn"
countries = ["CN"]

[[routing.rules]]
priority = 100
line = "cn-telecom"
countries = ["CN"]
isp_contains = ["China Telecom", "中国电信"]
