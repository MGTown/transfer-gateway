[server]
bind = "0.0.0.0:25565"
max_connections = 4096
login_timeout_ms = 10000
max_frame_length = 2097152

supported_protocols = []
status_version_name = "1.20.5 - 26.3 Snapshot 10"
status_protocol = 1073742156
max_players = 100

motd = "&6Transfer &aGateway\n&7IP routing gateway"
strict_error_handling = false

[language]
locale = "zh-CN"
directory = "./lang"

[logging]
file = "./logs/gateway.log"

[ip2region]
v4_db = "./data/ip2region_v4.xdb"
v6_db = "./data/ip2region_v6.xdb"
auto_download = true
# Periodically check and hot-apply newer databases from this directory.
auto_update = true
update_interval_secs = 86400
download_base_url = "https://raw.githubusercontent.com/lionsoul2014/ip2region/master/data"

[security]
# Reject VPN/proxy, Tor exit nodes, and IPs found in the shared Spam list.
enabled = true
block_vpn = true
block_tor = true
block_spam = true
# auto_download only fills missing list files; auto_update periodically replaces changed lists.
auto_download = true
# Periodically check and hot-apply changed lists.
auto_update = true
update_interval_secs = 86400
tor_exit_list = "./data/tor-exit-list.txt"
tor_exit_list_url = "https://check.torproject.org/torbulkexitlist"
spam_list = "./data/spam-ip-list.txt"
spam_list_url = "https://blackip.ustc.edu.cn/list.php?txt"
vpn_ipv4_list = "./data/vpn-ipv4.txt"
vpn_ipv4_list_url = "https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/vpn/ipv4.txt"
vpn_ipv6_list = "./data/vpn-ipv6.txt"
vpn_ipv6_list_url = "https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/vpn/ipv6.txt"
# Exact IPs or CIDRs that should never be blocked.
allowlist = []
# Optional ISP substring hints. Keep this conservative to avoid blocking normal
# residential users whose ISP database label contains a hosting keyword.
vpn_isp_contains = []

[routing]
default_line = "global"

[routing.lines.global]
host = "global.example.com"
port = 25565

[routing.lines.cn]
host = "cn.example.com"
port = 25565

[routing.lines.cn-telecom]
host = "telecom.example.com"
port = 25565

[[routing.rules]]
priority = 50
line = "cn"
countries = ["CN"]

[[routing.rules]]
priority = 100
line = "cn-telecom"
countries = ["CN"]
isp_contains = ["China Telecom", "中国电信"]

